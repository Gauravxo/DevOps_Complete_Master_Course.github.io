<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Learning Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #131820;
            --bg-card: #1a2330;
            --bg-card-hover: #212d3d;
            --border-color: #2a3a4f;
            --text-primary: #eef2f8;
            --text-secondary: #94a9c9;
            --text-muted: #5f7a9f;
            --accent-cyan: #58c4dc;
            --accent-blue: #4f8cff;
            --accent-purple: #a78bfa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-red: #f87171;
            --status-done: #34d399;
            --status-progress: #fbbf24;
            --status-pending: #5f7a9f;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 20px 60px;
            line-height: 1.5;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .app {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .logo {
            font-size: 32px;
            line-height: 1;
        }
        .header-left h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            -webkit-text-fill-color: var(--text-secondary);
            background: none;
            margin-left: 4px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-right .badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-right .badge strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ─── STATS ROW ─── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            text-align: center;
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }
        .stat-card .num {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }
        .stat-card.total .num {
            color: var(--text-primary);
        }
        .stat-card.done .num {
            color: var(--status-done);
        }
        .stat-card.progress .num {
            color: var(--status-progress);
        }
        .stat-card.pending .num {
            color: var(--status-pending);
        }

        /* ─── PROGRESS BAR ─── */
        .progress-wrap {
            margin-bottom: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
        }
        .progress-wrap .p-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .progress-wrap .p-label span {
            color: var(--text-primary);
            font-weight: 700;
        }
        .progress-track {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: var(--bg-primary);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }
        .progress-track .fill {
            height: 100%;
            width: 0%;
            border-radius: 40px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            transition: width 0.5s ease;
        }
        .progress-wrap .p-percent {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            min-width: 52px;
            text-align: right;
        }

        /* ─── TOOLBAR ─── */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .toolbar .search-wrap {
            flex: 1;
            min-width: 180px;
            position: relative;
        }
        .toolbar .search-wrap input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }
        .toolbar .search-wrap input::placeholder {
            color: var(--text-muted);
        }
        .toolbar .search-wrap input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.15);
        }
        .toolbar .search-wrap .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }
        .toolbar .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .toolbar .filter-group button {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }
        .toolbar .filter-group button:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }
        .toolbar .filter-group button.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }
        .toolbar .filter-group button[data-filter="done"].active {
            background: var(--status-done);
            border-color: var(--status-done);
        }
        .toolbar .filter-group button[data-filter="progress"].active {
            background: var(--status-progress);
            border-color: var(--status-progress);
            color: #0b0e14;
        }
        .toolbar .filter-group button[data-filter="pending"].active {
            background: var(--status-pending);
            border-color: var(--status-pending);
        }

        /* ─── MODULES ─── */
        .modules {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
        }
        .module-card:hover {
            border-color: var(--text-muted);
        }
        .module-card .mod-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
            position: relative;
        }
        .module-card .mod-header:hover {
            background: var(--bg-card-hover);
        }
        .module-card .mod-header .mod-num {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 28px;
        }
        .module-card .mod-header .mod-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .module-card .mod-header .mod-stats {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .module-card .mod-header .mod-stats .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 2px;
        }
        .module-card .mod-header .mod-stats .dot.done {
            background: var(--status-done);
        }
        .module-card .mod-header .mod-stats .dot.progress {
            background: var(--status-progress);
        }
        .module-card .mod-header .mod-stats .dot.pending {
            background: var(--status-pending);
        }
        .module-card .mod-header .mod-arrow {
            color: var(--text-muted);
            font-size: 18px;
            transition: transform var(--transition);
            margin-left: 4px;
        }
        .module-card .mod-header .mod-arrow.open {
            transform: rotate(180deg);
        }

        .module-card .mod-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 20px;
        }
        .module-card .mod-body.open {
            max-height: 9999px;
            padding: 0 20px 20px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px;
            padding-top: 4px;
        }
        .topic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid transparent;
            transition: var(--transition);
            cursor: pointer;
        }
        .topic-item:hover {
            border-color: var(--border-color);
            background: var(--bg-card-hover);
        }
        .topic-item .t-status {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: transparent;
        }
        .topic-item .t-status.done {
            background: var(--status-done);
            border-color: var(--status-done);
            color: #0b0e14;
        }
        .topic-item .t-status.progress {
            background: var(--status-progress);
            border-color: var(--status-progress);
            color: #0b0e14;
        }
        .topic-item .t-status.pending {
            background: transparent;
            border-color: var(--text-muted);
            color: var(--text-muted);
        }
        .topic-item .t-name {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 450;
            transition: var(--transition);
            word-break: break-word;
        }
        .topic-item .t-name.done {
            color: var(--text-secondary);
            text-decoration: line-through;
            text-decoration-color: var(--text-muted);
        }
        .topic-item .t-name.progress {
            color: var(--text-primary);
        }
        .topic-item .t-name.pending {
            color: var(--text-muted);
        }

        .topic-item .t-badge {
            margin-left: auto;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 2px 10px;
            border-radius: 40px;
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .topic-item .t-badge.done {
            background: rgba(52, 211, 153, 0.12);
            color: var(--status-done);
            border-color: rgba(52, 211, 153, 0.2);
        }
        .topic-item .t-badge.progress {
            background: rgba(251, 191, 36, 0.12);
            color: var(--status-progress);
            border-color: rgba(251, 191, 36, 0.2);
        }
        .topic-item .t-badge.pending {
            background: rgba(95, 122, 159, 0.08);
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        /* ─── EMPTY ─── */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 15px;
            color: var(--text-muted);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 760px) {
            .header-left h1 {
                font-size: 20px;
            }
            .header-left .sub {
                font-size: 12px;
                display: block;
                margin-left: 0;
            }
            .header-left .logo {
                font-size: 26px;
            }
            .stat-card .num {
                font-size: 22px;
            }
            .topic-grid {
                grid-template-columns: 1fr;
            }
            .module-card .mod-header {
                flex-wrap: wrap;
                gap: 6px;
            }
            .module-card .mod-header .mod-stats {
                font-size: 12px;
                width: 100%;
                margin-left: 36px;
            }
            .module-card .mod-header .mod-title {
                font-size: 15px;
            }
            .progress-wrap {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .progress-wrap .p-label {
                font-size: 13px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .filter-group {
                justify-content: center;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 14px 12px 40px;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-right .badge {
                font-size: 11px;
                padding: 4px 10px;
            }
            .module-card .mod-header {
                padding: 12px 14px;
            }
            .module-card .mod-body.open {
                padding: 0 14px 14px;
            }
            .topic-item {
                padding: 6px 10px;
                font-size: 13px;
            }
        }

        /* ─── TOOLTIP / MINI ─── */
        .topic-item .t-status {
            transition: all 0.15s ease;
        }
        .topic-item:active .t-status {
            transform: scale(0.85);
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🚀</span>
                <div>
                    <h1>DevOps Tracker & complete DevOps RoadMap  <span class="sub"> Please Follow me on GitHib @Gauravxo</span></h1>
                </div>
            </div>
            <div class="header-right">
                <span class="badge">📚 <strong id="totalTopics">0</strong> topics</span>
                <span class="badge">📅 <span id="lastUpdated">today</span></span>
            </div>
        </header>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card total"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
            <div class="stat-card done"><div class="num" id="statDone">0</div><div class="label">✅ Completed</div></div>
            <div class="stat-card progress"><div class="num" id="statProgress">0</div><div class="label">🔄 In Progress</div></div>
            <div class="stat-card pending"><div class="num" id="statPending">0</div><div class="label">⏳ Not Started</div></div>
        </div>

        <!-- PROGRESS BAR -->
        <div class="progress-wrap">
            <div class="p-label">📈 Progress <span id="progressFraction">0 / 0</span></div>
            <div class="progress-track"><div class="fill" id="progressFill" style="width:0%"></div></div>
            <div class="p-percent" id="progressPercent">0%</div>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="search-wrap">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search topics…" />
            </div>
            <div class="filter-group" id="filterGroup">
                <button data-filter="all" class="active">All</button>
                <button data-filter="done">✅ Done</button>
                <button data-filter="progress">🔄 Progress</button>
                <button data-filter="pending">⏳ Pending</button>
            </div>
        </div>

        <!-- MODULES -->
        <div class="modules" id="modulesContainer"></div>

        <!-- EMPTY STATE (hidden by default) -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="emoji">🔍</span>
            <h3>No topics match</h3>
            <p>Try adjusting your search or filter.</p>
        </div>

    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA — all modules & topics with initial status
        //  "done"    = 🔴  (completed)
        //  "progress" = 🟡  (in progress / partial)
        //  "pending"  = not started (no emoji)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const MODULES_DATA = [{
            id: 1,
            name: "Linux Fundamentals",
            topics: [
                "Linux Architecture",
                "Boot Process (BIOS → UEFI → GRUB → Kernel → systemd)",
                "Filesystem Hierarchy (FHS)",
                "Inodes",
                "Hard Link vs Soft Link",
                "File Permissions",
                "ACL",
                "File Attributes (chattr, lsattr)",
                "Users & Groups",
                "sudo & PAM Basics",
                "systemd Basics",
                "systemctl",
                "journalctl",
                "Environment Variables",
                "Bash Shell",
                "SSH"
            ].map(t => ({ name: t, status: t.includes("File Attributes") || t.includes("sudo") ? 'progress' : 'done' }))
        }, {
            id: 2,
            name: "Linux Process Management",
            topics: [
                "Process Lifecycle",
                "Process States",
                "fork()",
                "vfork()",
                "clone()",
                "execve()",
                "Process Tree",
                "Threads",
                "Scheduling",
                "Nice Values",
                "CPU Affinity",
                "Context Switching",
                "Signals",
                "Zombie Process",
                "Orphan Process",
                "Daemons",
                "Process Groups",
                "Sessions"
            ].map(t => ({ name: t, status: t.includes("CPU Affinity") || t.includes("Process Groups") || t.includes(
                    "Sessions") ? 'progress' : 'done' }))
        }, {
            id: 3,
            name: "Linux Memory",
            topics: [
                "Virtual Memory",
                "Page Tables",
                "Page Cache",
                "Anonymous Memory",
                "Swap",
                "OOM Killer",
                "HugePages",
                "Transparent Huge Pages",
                "NUMA (Practical)",
                "Copy-on-Write",
                "mmap()"
            ].map(t => ({ name: t, status: t.includes("HugePages") || t.includes("Transparent") || t.includes(
                    "NUMA") || t.includes("mmap") ? 'progress' : 'done' }))
        }, {
            id: 4,
            name: "Linux Performance",
            topics: [
                "top", "htop", "vmstat", "iostat", "iotop", "sar", "pidstat", "free", "uptime", "mpstat", "perf",
                "Flame Graphs", "eBPF (Practical)"
            ].map(t => ({ name: t, status: t.includes("iotop") || t.includes("mpstat") || t.includes("Flame") || t
                    .includes("eBPF") ? 'progress' : 'done' }))
        }, {
            id: 5,
            name: "Linux Debugging",
            topics: [
                "strace", "ltrace", "/proc", "/sys", "File Descriptors", "lsof", "inotify", "Core Dumps",
                "Crash Investigation"
            ].map(t => ({ name: t, status: t.includes("ltrace") || t.includes("/sys") || t.includes("inotify") || t
                    .includes("Core") || t.includes("Crash") ? 'progress' : 'done' }))
        }, {
            id: 6,
            name: "Linux I/O",
            topics: [
                "Blocking vs Non-blocking I/O",
                "Sync vs Async I/O",
                "select()",
                "poll()",
                "epoll()",
                "io_uring (Concepts)",
                "Zero-copy",
                "sendfile()",
                "splice()",
                "DMA (Concepts)"
            ].map(t => ({ name: t, status: t.includes("io_uring") || t.includes("sendfile") || t.includes("splice") ||
                    t.includes("DMA") ? 'progress' : 'done' }))
        }, {
            id: 7,
            name: "Linux Networking",
            topics: [
                "TCP/IP", "TCP Handshake", "TCP States", "UDP", "DNS", "HTTP / HTTPS", "TLS Basics",
                "Socket Basics", "ip", "ss", "netstat (Legacy)", "traceroute", "tcpdump", "Wireshark Basics",
                "iptables (Concepts)", "nftables (Concepts)"
            ].map(t => ({ name: t, status: t.includes("netstat") || t.includes("traceroute") || t.includes(
                    "Wireshark") || t.includes("nftables") ? 'progress' : 'done' }))
        }, {
            id: 8,

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        let modules = JSON.parse(JSON.stringify(MODULES_DATA));
        let currentFilter = 'all';
        let searchQuery = '';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function getStatusEmoji(status) {
            if (status === 'done') return '✅';
            if (status === 'progress') return '🔄';
            return '⏳';
        }

        function getStatusLabel(status) {
            if (status === 'done') return 'Done';
            if (status === 'progress') return 'Progress';
            return 'Pending';
        }

        function getNextStatus(current) {
            if (current === 'pending') return 'progress';
            if (current === 'progress') return 'done';
            return 'pending';
        }

        function countStatuses(mods) {
            let total = 0,
                done = 0,
                progress = 0,
                pending = 0;
            for (const m of mods) {
                for (const t of m.topics) {
                    total++;
                    if (t.status === 'done') done++;
                    else if (t.status === 'progress') progress++;
                    else pending++;
                }
            }
            return { total, done, progress, pending };
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function render() {
            const container = document.getElementById('modulesContainer');
            const empty = document.getElementById('emptyState');

            // Filter + search
            const filtered = modules.map(mod => {
                const topics = mod.topics.filter(t => {
                    const matchStatus = currentFilter === 'all' || t.status === currentFilter;
                    const matchSearch = t.name.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchStatus && matchSearch;
                });
                return { ...mod, topics };
            }).filter(mod => mod.topics.length > 0);

            if (filtered.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                let html = '';
                for (const mod of filtered) {
                    const stats = countStatuses([mod]);
                    const pct = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
                    const isOpen = true; // all open by default

                    html += `
                <div class="module-card" data-module="${mod.id}">
                  <div class="mod-header" data-toggle="${mod.id}">
                    <span class="mod-num">#${mod.id}</span>
                    <span class="mod-title">${mod.name}</span>
                    <span class="mod-stats">
                      <span><span class="dot done"></span> ${stats.done}</span>
                      <span><span class="dot progress"></span> ${stats.progress}</span>
                      <span><span class="dot pending"></span> ${stats.pending}</span>
                      <span style="color:var(--text-muted);font-weight:400;">·</span>
                      <span>${pct}%</span>
                    </span>
                    <span class="mod-arrow ${isOpen ? 'open' : ''}">▾</span>
                  </div>
                  <div class="mod-body ${isOpen ? 'open' : ''}">
                    <div class="topic-grid">
                      ${mod.topics.map(t => `
                        <div class="topic-item" data-module="${mod.id}" data-topic="${t.name}" data-status="${t.status}">
                          <span class="t-status ${t.status}">${t.status === 'done' ? '✓' : t.status === 'progress' ? '◐' : ''}</span>
                          <span class="t-name ${t.status}">${t.name}</span>
                          <span class="t-badge ${t.status}">${getStatusLabel(t.status)}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              `;
                }
                container.innerHTML = html;
            }

            // Update stats
            const allStats = countStatuses(modules);
            document.getElementById('statTotal').textContent = allStats.total;
            document.getElementById('statDone').textContent = allStats.done;
            document.getElementById('statProgress').textContent = allStats.progress;
            document.getElementById('statPending').textContent = allStats.pending;
            document.getElementById('totalTopics').textContent = allStats.total;

            const pct = allStats.total > 0 ? Math.round((allStats.done / allStats.total) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPercent').textContent = pct + '%';
            document.getElementById('progressFraction').textContent = `${allStats.done} / ${allStats.total}`;

            // Update date
            const now = new Date();
            document.getElementById('lastUpdated').textContent =
                now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            // Re-bind events
            bindEvents();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function bindEvents() {
            // Topic click — toggle status
            document.querySelectorAll('.topic-item').forEach(el => {
                el.removeEventListener('click', handleTopicClick);
                el.addEventListener('click', handleTopicClick);
            });

            // Module header toggle
            document.querySelectorAll('.mod-header').forEach(el => {
                el.removeEventListener('click', handleToggleModule);
                el.addEventListener('click', handleToggleModule);
            });
        }

        function handleTopicClick(e) {
            const item = e.currentTarget;
            const modId = parseInt(item.dataset.module);
            const topicName = item.dataset.topic;
            const currentStatus = item.dataset.status;
            const nextStatus = getNextStatus(currentStatus);

            // Update data
            const mod = modules.find(m => m.id === modId);
            if (mod) {
                const topic = mod.topics.find(t => t.name === topicName);
                if (topic) {
                    topic.status = nextStatus;
                    item.dataset.status = nextStatus;
                    // Update visual
                    const statusEl = item.querySelector('.t-status');
                    const nameEl = item.querySelector('.t-name');
                    const badgeEl = item.querySelector('.t-badge');
                    statusEl.className = `t-status ${nextStatus}`;
                    statusEl.textContent = nextStatus === 'done' ? '✓' : nextStatus === 'progress' ? '◐' : '';
                    nameEl.className = `t-name ${nextStatus}`;
                    badgeEl.className = `t-badge ${nextStatus}`;
                    badgeEl.textContent = getStatusLabel(nextStatus);
                }
            }

            // Re-render stats & module headers
            updateStatsAndHeaders();
        }

        function handleToggleModule(e) {
            const header = e.currentTarget;
            const body = header.nextElementSibling;
            const arrow = header.querySelector('.mod-arrow');
            if (body) {
                body.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            }
        }

        function updateStatsAndHeaders() {
            // Update global stats & progress
            const allStats = countStatuses(modules);
            document.getElementById('statTotal').textContent = allStats.total;
            document.getElementById('statDone').textContent = allStats.done;
            document.getElementById('statProgress').textContent = allStats.progress;
            document.getElementById('statPending').textContent = allStats.pending;
            document.getElementById('totalTopics').textContent = allStats.total;

            const pct = allStats.total > 0 ? Math.round((allStats.done / allStats.total) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPercent').textContent = pct + '%';
            document.getElementById('progressFraction').textContent = `${allStats.done} / ${allStats.total}`;

            // Update each module header stats
            for (const mod of modules) {
                const card = document.querySelector(`.module-card[data-module="${mod.id}"]`);
                if (!card) continue;
                const stats = countStatuses([mod]);
                const pctMod = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
                const statsEl = card.querySelector('.mod-stats');
                if (statsEl) {
                    statsEl.innerHTML = `
                    <span><span class="dot done"></span> ${stats.done}</span>
                    <span><span class="dot progress"></span> ${stats.progress}</span>
                    <span><span class="dot pending"></span> ${stats.pending}</span>
                    <span style="color:var(--text-muted);font-weight:400;">·</span>
                    <span>${pctMod}%</span>
                  `;
                }
            }

            // Re-bind in case DOM changed
            bindEvents();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FILTER & SEARCH
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        document.getElementById('filterGroup').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const filter = btn.dataset.filter;
            if (!filter) return;
            currentFilter = filter;
            document.querySelectorAll('#filterGroup button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            render();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        render();
    </script>
